name: release

# Wheels for every platform on every version tag; a manual run builds them
# without publishing, to check a release before tagging it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: One wheel for Python 3.10 and later, one for free-threaded 3.14
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          # BoringSSL builds with CMake.
          before-script-linux: dnf install -y cmake perl-IPC-Cmd clang
          args: --release --out dist -i python3.10 -i python3.14t
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14t
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.10 -i python3.14t
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.14t
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -i python3.10 -i python3.14t
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-windows
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist

  # Every wheel installs and passes the tests before anything is published.
  check:
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.10", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the built wheel, not the source
        run: |
          uv venv
          uv pip install --no-index --find-links dist netweir
          uv pip install pytest pytest-asyncio pyarrow
          rm -rf python
          uv run --no-project pytest -q tests
        shell: bash

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing: no token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
