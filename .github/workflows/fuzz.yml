name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, css, xpath]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for five minutes
        working-directory: crates/netweir-dom
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=4096
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-${{ matrix.target }}
          path: crates/netweir-dom/fuzz/artifacts
