name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, css, xpath]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for five minutes
        working-directory: crates/netweir-dom
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=4096
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-${{ matrix.target }}
          path: crates/netweir-dom/fuzz/artifacts
